<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ЛК базы my (issue #5420). Страница без ролевых блоков: обе разметки лежат в template,
         js/my-mode.js выбирает режим по виду пользователя (AppView.getView) и вставляет свою.
         Режим cabinet — ЛК клиента (js/cabinet.js), режим admin — рабочее место админа и
         суперадмина (js/main-app.js, страницы ядра через маркер File: a, на корне info.html).
         Данные отчётов ЛК — templates/my/cabdata.html. Фигурные скобки в тексте шаблона —
         только _global_ и поля блоков (правило CLAUDE.md, issue #5231). -->
    <title>Интеграм — личный кабинет</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/assets/vendor/primeicons/primeicons.css">
    <script>
        var db='{_global_.z}',xsrf='{_global_.xsrf}',id='{_global_.id}',token='{_global_.token}',
            uid='{_global_.user_id}',user='{_global_.user}',name=user,role='{_global_.role}',
            roleId='{_global_.role_id}',action='{_global_.action}',grantsB64='{_global_.grants}',menu=[];
    </script>
    <script src="/js/app-view.js"></script>
    <script src="/js/my-mode.js"></script>

    <template id="my-head-admin">
        <link rel="stylesheet" href="/css/main-app.css">
        <style>
            html { font-size: .82rem; }
        </style>
        <script>
            var menuData = [
            <!-- Begin: MyRoleMenu -->
            {menu_id:'{menu_id}',menu_up:'{menu_up}',name:'{name}',href:'{href}',icon:'{icon}'},
            <!-- End: MyRoleMenu -->
            ];
            function post(a) {
                var f = document.getElementById('post');
                if (f._xsrf) f._xsrf.value = xsrf;
                f.action = '/' + db + '/' + a;
                f.submit();
                return false;
            }
        </script>
        <script src="/js/my-admin-head.js"></script>
    </template>

    <template id="my-head-cabinet">
        <link rel="stylesheet" href="/css/cabinet.css">
        <link rel="stylesheet" href="/css/my-cabinet.css?v=5447">
    </template>

    <script>MyMode.put('head')</script>
</head>
<body>
<template id="my-body-admin">
    <nav class="navbar">
        <div class="navbar-left">
            <button id="mobile-sidebar-toggle" class="mobile-sidebar-toggle" type="button" aria-label="Открыть меню" title="Открыть меню"><i class="pi pi-bars"></i></button>
            <a href="/{_global_.z}/" class="navbar-brand">
                <img src="/images/logo.png" alt="Logo" class="logo">
                <span class="brand-name">{_global_.z}</span>
            </a>
            <nav id="app-topmenu" class="app-topmenu" aria-label="Меню"></nav>
        </div>
        <div class="navbar-center">
            <div class="navbar-workspace">{_global_.action}</div>
        </div>
        <div class="navbar-right">
            <div class="user-menu-wrapper">
                <button id="user-menu-toggle" class="account-info" type="button" title="Имя пользователя / роль">
                    <div id="account-avatar" class="account-avatar">{_global_.user}</div>
                    <span id="account-email" class="account-email">{_global_.user} / {_global_.role}</span>
                    <i class="user-menu-arrow pi pi-chevron-down"></i>
                </button>
                <div id="user-menu-dropdown" class="user-menu-dropdown" style="display: none;">
                    <div class="user-menu-userinfo"><span>{_global_.user} / {_global_.role}</span></div>
                    <div class="user-menu-divider user-menu-divider-mobile"></div>
                    <button id="theme-toggle" class="user-menu-item" type="button">
                        <i class="user-menu-icon pi pi-moon" id="theme-icon"></i>
                        <span>Тема</span>
                        <span class="user-menu-value" id="theme-value">Темная</span>
                    </button>
                    <div class="user-menu-item user-menu-font-size-row" title="Размер шрифта">
                        <i class="user-menu-icon pi pi-sliders-h"></i>
                        <span>Шрифт</span>
                        <div class="navbar-font-size-group">
                            <button type="button" class="navbar-font-size-btn" data-size="smaller" onclick="setPageFontSize('smaller')" title="Шрифт меньше" style="font-size:11px;">А</button>
                            <button type="button" class="navbar-font-size-btn" data-size="normal" onclick="setPageFontSize('normal')" title="Шрифт обычный" style="font-size:14px;">А</button>
                            <button type="button" class="navbar-font-size-btn" data-size="larger" onclick="setPageFontSize('larger')" title="Шрифт больше" style="font-size:17px;">А</button>
                        </div>
                    </div>
                    <div class="user-menu-divider"></div>
                    <button id="change-password-btn" class="user-menu-item" type="button" onclick="openChangePasswordForm();">
                        <i class="user-menu-icon pi pi-lock"></i>
                        <span>Сменить пароль</span>
                    </button>
                    <div class="user-menu-divider"></div>
                    <button id="logout-everywhere-btn" class="user-menu-item user-menu-item-danger" type="button" title="Выйти на всех устройствах, где совершен вход">
                        <i class="user-menu-icon pi pi-sign-out"></i>
                        <span>Выйти везде</span>
                    </button>
                    <button id="logout-btn" class="user-menu-item user-menu-item-danger" type="button">
                        <i class="user-menu-icon pi pi-sign-out"></i>
                        <span>Выйти</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <div class="app-layout">
        <aside class="app-sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Свернуть/развернуть меню" aria-label="Toggle sidebar"><i class="pi pi-bars"></i></button>
                <div class="menu-search-wrapper">
                    <i class="pi pi-search menu-search-icon"></i>
                    <input type="text" id="menu-search" class="menu-search-input" placeholder="Поиск..." aria-label="Поиск по меню" autocomplete="off">
                    <button type="button" id="menu-search-clear" class="menu-search-clear" style="display: none;" aria-label="Очистить поиск"><i class="pi pi-times"></i></button>
                </div>
            </div>
            <nav class="app-menu" id="app-menu"></nav>
            <button id="sidebar-settings" class="sidebar-settings" type="button" title="Редактировать меню" aria-label="Edit menu"><i class="pi pi-cog"></i></button>
            <div class="sidebar-resize-handle"></div>
        </aside>
        <main class="app-content">
            <!-- File: a -->
        </main>
    </div>
    <form method="POST" id="post" action="/{_global_.z}/" style="display:none;"><input type="hidden" name="_xsrf" value="{_global_.xsrf}"></form>
    <script src="/js/app.js"></script>
    <script src="/js/main-app.js"></script>
    <script src="/js/form-submit.js" defer></script>
</template>

<template id="my-body-cabinet">
    <header class="navbar mc-topbar">
        <div class="navbar-left">
            <a href="/start.html" class="mc-brand" title="Ваш личный кабинет Интеграм">
                <img src="/images/logo.png" alt="Интеграм" class="logo">
                <span class="mc-brand-name">Интеграм</span>
                <span class="mc-brand-tag">личный кабинет</span>
            </a>
        </div>
        <div class="navbar-right">
            <div class="user-menu-wrapper">
                <button id="user-menu-toggle" class="account-info" type="button" title="Меню пользователя">
                    <div id="account-avatar" class="account-avatar">U</div>
                    <span id="account-email" class="account-email"></span>
                    <i class="user-menu-arrow pi pi-chevron-down"></i>
                </button>
                <div id="user-menu-dropdown" class="user-menu-dropdown" style="display: none;">
                    <button id="theme-toggle" class="user-menu-item" type="button">
                        <span class="user-menu-icon" id="theme-icon"><i class="pi pi-moon"></i></span>
                        <span>Тема</span>
                        <span class="user-menu-value" id="theme-value">Темная</span>
                    </button>
                    <div class="user-menu-divider"></div>
                    <button id="change-password-btn" class="user-menu-item" type="button" onclick="openChangePasswordForm();">
                        <span class="user-menu-icon"><i class="pi pi-lock"></i></span>
                        <span>Сменить пароль</span>
                    </button>
                    <div class="user-menu-divider"></div>
                    <button id="logout-everywhere-btn" class="user-menu-item user-menu-item-danger" type="button" title="Выйти на всех устройствах, где совершен вход">
                        <span class="user-menu-icon"><i class="pi pi-sign-out"></i></span>
                        <span>Выйти везде</span>
                    </button>
                    <button id="logout-btn" class="user-menu-item user-menu-item-danger" type="button">
                        <span class="user-menu-icon"><i class="pi pi-sign-out"></i></span>
                        <span>Выйти</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="cabinet-layout mc-layout">
        <aside class="cabinet-sidebar mc-sidebar" id="cabinet-sidebar">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Свернуть меню" aria-label="Свернуть меню"><i class="pi pi-bars"></i></button>
            <nav class="cabinet-menu" aria-label="Разделы кабинета">
                <button class="cabinet-menu-item" data-section="overview" type="button"><span class="menu-icon"><i class="pi pi-home"></i></span><span>Обзор</span></button>
                <button class="cabinet-menu-item" data-section="databases" type="button"><span class="menu-icon"><i class="pi pi-database"></i></span><span>Базы данных</span></button>
                <button class="cabinet-menu-item" data-section="community" type="button"><span class="menu-icon"><i class="pi pi-share-alt"></i></span><span>Кооперации</span></button>
                <div class="mc-menu-caption">Оплата</div>
                <button class="cabinet-menu-item" data-section="tariff" type="button"><span class="menu-icon"><i class="pi pi-tag"></i></span><span>Тариф</span></button>
                <button class="cabinet-menu-item" data-section="balance" type="button"><span class="menu-icon"><i class="pi pi-wallet"></i></span><span>Баланс</span></button>
                <button class="cabinet-menu-item" data-section="bonuses" type="button"><span class="menu-icon"><i class="pi pi-gift"></i></span><span>Бонусы</span></button>
                <button class="cabinet-menu-item" data-section="referrals" type="button"><span class="menu-icon"><i class="pi pi-users"></i></span><span>Партнёрам</span></button>
                <div class="mc-menu-caption">Аккаунт</div>
                <button class="cabinet-menu-item" data-section="profile" type="button"><span class="menu-icon"><i class="pi pi-user"></i></span><span>Профиль</span></button>
                <button class="cabinet-menu-item cabinet-menu-item--disabled" type="button" disabled title="Скоро"><span class="menu-icon"><i class="pi pi-shop"></i></span><span>Маркетплейс</span></button>
            </nav>
        </aside>

        <main class="cabinet-content mc-content">
            <div id="loading-state" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Загрузка данных...</p>
            </div>

            <section id="section-overview" class="cabinet-section" style="display: none;">
                <div class="mc-section-head">
                    <div>
                        <h1>Здравствуйте<span id="mc-hello-name"></span></h1>
                        <p class="mc-lead">Ваши базы, тариф и счёт — на одной странице.</p>
                    </div>
                    <button type="button" class="btn-primary" data-mc-go="databases" data-mc-create="1"><i class="pi pi-plus"></i> Создать базу</button>
                </div>
                <div class="mc-kpis">
                    <button type="button" class="mc-kpi" data-mc-go="databases">
                        <span class="mc-kpi-label"><i class="pi pi-database"></i> Базы данных</span>
                        <strong class="mc-kpi-value" id="mc-kpi-dbs">—</strong>
                        <span class="mc-kpi-note" id="mc-kpi-dbs-note"></span>
                    </button>
                    <button type="button" class="mc-kpi" data-mc-go="tariff">
                        <span class="mc-kpi-label"><i class="pi pi-tag"></i> Тариф</span>
                        <strong class="mc-kpi-value" id="mc-kpi-plan">—</strong>
                        <span class="mc-kpi-note" id="mc-kpi-plan-note"></span>
                    </button>
                    <button type="button" class="mc-kpi" data-mc-go="balance">
                        <span class="mc-kpi-label"><i class="pi pi-wallet"></i> Баланс</span>
                        <strong class="mc-kpi-value" id="mc-kpi-balance">—</strong>
                        <span class="mc-kpi-note">руб. на счёте</span>
                    </button>
                    <button type="button" class="mc-kpi" data-mc-go="bonuses">
                        <span class="mc-kpi-label"><i class="pi pi-gift"></i> Бонусы</span>
                        <strong class="mc-kpi-value" id="mc-kpi-bonuses">—</strong>
                        <span class="mc-kpi-note">1 бонус = 1 рубль</span>
                    </button>
                </div>
                <div class="mc-card">
                    <div class="mc-card-head">
                        <h2>Расход ресурсов в этом месяце</h2>
                        <span class="mc-muted"><strong id="mc-usage-units">0</strong> из <strong id="mc-usage-limit">—</strong> ед.</span>
                    </div>
                    <div class="usage-bar"><div id="mc-usage-fill" class="usage-bar-fill" style="width: 0%;"></div></div>
                    <p class="mc-muted" id="mc-usage-note"></p>
                </div>
                <div class="mc-card">
                    <div class="mc-card-head">
                        <h2>Недавние базы</h2>
                        <button type="button" class="mc-link-btn" data-mc-go="databases">Все базы <i class="pi pi-arrow-right"></i></button>
                    </div>
                    <div id="mc-recent-dbs" class="mc-recent"></div>
                </div>
            </section>

            <section id="section-databases" class="cabinet-section" style="display: none;">
                <div class="databases-header mc-section-head">
                    <div>
                        <h1>Базы данных</h1>
                        <p class="mc-lead">Откройте базу, настройте регистрацию и время жизни токена.</p>
                    </div>
                    <div class="databases-controls">
                        <div class="mc-search">
                            <i class="pi pi-search"></i>
                            <input type="text" id="databases-search" class="databases-search-input" placeholder="Поиск по базам" title="Поиск по любому полю">
                        </div>
                        <div class="databases-sort-wrapper">
                            <button type="button" id="databases-sort-btn" class="databases-sort-btn" title="Сортировка"><i class="pi pi-sort-alt"></i></button>
                            <div id="databases-sort-dropdown" class="databases-sort-dropdown" style="display:none;">
                                <button type="button" class="sort-option" data-sort="name" data-dir="asc">По имени ↑</button>
                                <button type="button" class="sort-option" data-sort="name" data-dir="desc">По имени ↓</button>
                                <button type="button" class="sort-option" data-sort="count" data-dir="asc">По расходу ↑</button>
                                <button type="button" class="sort-option" data-sort="count" data-dir="desc">По расходу ↓</button>
                                <button type="button" class="sort-option" data-sort="date" data-dir="asc">По дате ↑</button>
                                <button type="button" class="sort-option" data-sort="date" data-dir="desc">По дате ↓</button>
                            </div>
                        </div>
                        <button type="button" id="create-db-btn" class="btn-primary btn-small"><i class="pi pi-plus"></i> Создать базу</button>
                    </div>
                </div>

                <div id="wanted-db-offer" class="create-db-form mc-card" style="display:none;">
                    <p class="wanted-db-question">Вы хотели создать базу «<b id="wanted-db-name"></b>»?</p>
                    <div class="create-db-actions">
                        <button type="button" id="wanted-db-yes" class="btn-primary btn-small">Да, создать</button>
                        <button type="button" id="wanted-db-no" class="btn-secondary btn-small">Нет</button>
                    </div>
                </div>

                <div id="create-db-form" class="create-db-form mc-card" style="display:none;">
                    <div class="create-db-fields">
                        <div class="create-db-field">
                            <label for="new-db-name">Имя базы данных</label>
                            <input type="text" id="new-db-name" class="database-field-input" autocomplete="off" placeholder="от 3 до 15 латинских символов" title="От 3 до 15 латинских символов и цифр, начиная с буквы">
                            <span id="new-db-name-error" class="create-db-error" style="display:none;"></span>
                        </div>
                        <div class="create-db-field">
                            <label for="new-db-template">Шаблон</label>
                            <select id="new-db-template" class="database-field-input">
                                <option value="RU">Русский</option>
                                <option value="CM">Сопоставление каталогов</option>
                            </select>
                        </div>
                        <div class="create-db-actions">
                            <button type="button" id="create-db-submit-btn" class="btn-primary btn-small">Создать</button>
                            <button type="button" id="create-db-cancel-btn" class="btn-secondary btn-small">Отменить</button>
                        </div>
                    </div>
                    <div id="db-limit-warning" class="db-limit-warning" style="display:none;">На бесплатном тарифном плане можно создать не более трёх баз данных.</div>
                </div>

                <div class="databases-list" id="databases-list"></div>
                <div id="tpl-moderation" class="tpl-moderation mc-card" style="display:none;"></div>
            </section>

            <section id="section-community" class="cabinet-section" style="display: none;">
                <div class="community-header mc-section-head">
                    <div>
                        <h1>Кооперации</h1>
                        <p class="mc-lead">Приглашайте людей в свои базы и запрашивайте доступ к чужим.</p>
                    </div>
                    <div class="mc-search">
                        <i class="pi pi-search"></i>
                        <input type="text" id="community-search" class="community-search-input" placeholder="Поиск" title="Поиск по всем полям карточек">
                    </div>
                </div>
                <div class="community-tabs mc-tabs">
                    <button class="community-tab active" data-community-tab="my-invites" type="button">Приглашенные мной</button>
                    <button class="community-tab" data-community-tab="invitations" type="button">Приглашения мне</button>
                    <button class="community-tab" data-community-tab="requests" type="button">Запросы</button>
                </div>
                <div class="community-filter">
                    <label class="community-radio-label"><input type="radio" name="community-archive" value="active" checked> Активные</label>
                    <label class="community-radio-label"><input type="radio" name="community-archive" value="archive"> Архив</label>
                    <button type="button" id="invite-btn" class="btn-primary btn-small" style="display:none; margin-left: auto;"><i class="pi pi-user-plus"></i> Пригласить</button>
                </div>
                <div id="invite-form" class="invite-form mc-card" style="display:none;">
                    <div class="invite-form-fields">
                        <div class="invite-form-field">
                            <label for="invite-db" class="database-field-label">База данных</label>
                            <select id="invite-db" class="database-field-input"></select>
                        </div>
                        <div class="invite-form-field">
                            <label for="invite-user" class="database-field-label">Имя или email (необязательно)</label>
                            <input type="text" id="invite-user" class="database-field-input" placeholder="Имя или email приглашаемого">
                        </div>
                        <div class="invite-form-field">
                            <label for="invite-descr" class="database-field-label">Описание (необязательно)</label>
                            <input type="text" id="invite-descr" class="database-field-input" placeholder="Описание приглашения">
                        </div>
                        <div class="invite-form-actions">
                            <button type="button" id="invite-submit-btn" class="btn-primary btn-small">Отправить</button>
                            <button type="button" id="invite-cancel-btn" class="btn-secondary btn-small">Отменить</button>
                        </div>
                    </div>
                </div>
                <div class="community-tab-content active" id="community-tab-my-invites">
                    <div class="community-list" id="community-my-invites-list"><p class="empty-message">Загрузка данных...</p></div>
                </div>
                <div class="community-tab-content" id="community-tab-invitations" style="display: none;">
                    <div class="community-list" id="community-invitations-list"><p class="empty-message">Загрузка данных...</p></div>
                </div>
                <div class="community-tab-content" id="community-tab-requests" style="display: none;">
                    <div class="community-requests-filter">
                        <label class="community-radio-label"><input type="radio" name="community-requests-type" value="to-me" checked> Запросы к моей базе</label>
                        <label class="community-radio-label"><input type="radio" name="community-requests-type" value="from-me"> Мои запросы к чужим базам</label>
                        <button type="button" id="create-request-btn" class="btn-primary btn-small" style="margin-left: auto; display: none;">Создать запрос</button>
                    </div>
                    <div id="create-request-form" class="invite-form mc-card" style="display:none;">
                        <div class="invite-form-fields">
                            <div class="invite-form-field">
                                <label for="request-db" class="database-field-label">Имя базы данных</label>
                                <input type="text" id="request-db" class="database-field-input" placeholder="Имя базы данных">
                                <span id="request-db-error" class="field-error" style="display:none;">База не найдена или скрыта владельцем</span>
                            </div>
                            <div class="invite-form-field">
                                <label for="request-descr" class="database-field-label">Обоснование (необязательно)</label>
                                <input type="text" id="request-descr" class="database-field-input" placeholder="Сопроводительный текст к запросу">
                            </div>
                            <div class="invite-form-actions">
                                <button type="button" id="request-submit-btn" class="btn-primary btn-small">Отправить</button>
                                <button type="button" id="request-cancel-btn" class="btn-secondary btn-small">Отменить</button>
                            </div>
                        </div>
                    </div>
                    <div class="community-list" id="community-requests-list"><p class="empty-message">Загрузка данных...</p></div>
                </div>
            </section>

            <section id="section-tariff" class="cabinet-section" style="display: none;">
                <div class="mc-section-head">
                    <div>
                        <h1>Тариф</h1>
                        <p class="mc-lead">Списание раз в месяц; вместе с ним обнуляются счётчики ресурсов всех ваших баз.</p>
                    </div>
                </div>
                <div class="tariff-section">
                    <div class="tariff-info">
                        <div class="mc-kpis mc-kpis-2">
                            <div class="mc-kpi mc-kpi-static">
                                <span class="mc-kpi-label">Ваш тариф</span>

    <script>
    function getChangePasswordFields(){
        return document.querySelectorAll('#old-pwd,#new-pwd,#new-again');
    }
    function resetChangePasswordFields(){
        getChangePasswordFields().forEach(function(el){
            el.value='';
            el.disabled=true;
        });
    }
    function openChangePasswordForm(){
        var form=document.querySelector('.cp-form');
        if(form)form.style.display='block';
        getChangePasswordFields().forEach(function(el){
            el.value='';
            el.disabled=false;
        });
        document.querySelectorAll('.ch-toggle').forEach(function(el){el.style.display='flex';});
        document.querySelectorAll('.wait-toggle').forEach(function(el){el.style.display='none';});
    }
    function closeChangePasswordForm(){
        var form=document.querySelector('.cp-form');
        if(form)form.style.display='none';
        resetChangePasswordFields();
    }
    function changePwd(){
        var oldPwd=document.getElementById('old-pwd').value,
            newPwd=document.getElementById('new-pwd').value,
            newAgain=document.getElementById('new-again').value;
        if(oldPwd===''||newPwd===''||newAgain==='')
            return changeMsg('alert-danger','Заполните все поля');
        document.querySelectorAll('.ch-toggle').forEach(function(el){el.style.display='none';});
        document.querySelectorAll('.wait-toggle').forEach(function(el){el.style.display='block';});
        var obj=new XMLHttpRequest();
        obj.open('POST','/'+db+'/auth?JSON',true);
        obj.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
        obj.onload=function(){
            document.querySelectorAll('.ch-toggle').forEach(function(el){el.style.display='flex';});
            document.querySelectorAll('.wait-toggle').forEach(function(el){el.style.display='none';});
            var json;
            try{json=JSON.parse(this.responseText);}
            catch(e){console.log(e);document.getElementById('pwdchangemsg').innerHTML=this.responseText;}
            if(json&&json.msg){
                if(json.msg.indexOf('[err')===-1){
                    changeMsg('alert-success',json.msg);
                    resetChangePasswordFields();
                }else
                    changeMsg('alert-danger',json.msg.replace(/ ?\[.+\]/,''));
                if(json.token)token=json.token;
                if(json.xsrf)xsrf=json.xsrf;
            }else
                changeMsg('alert-danger','Неверный пароль');
        };
        obj.send('change=1&login='+user+'&pwd='+encodeURIComponent(oldPwd)+'&npw1='+encodeURIComponent(newPwd)+'&npw2='+encodeURIComponent(newAgain));
    }
    function changeMsg(cl,msg){
        var el=document.getElementById('pwdchangemsg');
        el.className='alert w-100 '+cl;
        el.innerHTML=msg;
        el.style.display='block';
        setTimeout(function(){
            el.style.transition='opacity 0.4s';
            el.style.opacity='0';
            setTimeout(function(){el.style.display='none';el.style.opacity='';el.style.transition='';},400);
        },4500);
    }
    </script>

    <!-- Change Password Modal -->
    <div class="cp-form" style="display: none; position: fixed; top: 0; left: 0; height: 100%; width: 100%; z-index: 9999; background: rgba(0,0,0,.4);" onclick="closeChangePasswordForm();">
        <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
            <div style="border-radius: 8px; background-color: #fff; max-width: 360px; width: 100%; padding: 1.5rem; box-shadow: 0 4px 24px rgba(0,0,0,.18);" onclick="event.stopPropagation();" onkeyup="if(event.keyCode===13)changePwd()">
                <div style="text-align:center; margin-bottom:1rem;">
                    <h5 style="margin:0;">Смена пароля</h5>
                </div>
                <div id="pwdchangemsg" class="alert w-100" style="display: none;"></div>
                <label for="old-pwd" style="margin-bottom:0.25rem; display:block;">Действующий пароль</label>
                <input type="password" id="old-pwd" autocomplete="current-password" disabled style="border: 1px solid lightgray; margin-bottom: 0.75rem; padding: 0.375rem 0.5rem; width: 100%; border-radius: 4px; box-sizing:border-box;">
                <label for="new-pwd" style="margin-bottom:0.25rem; display:block;">Новый пароль</label>
                <input type="password" id="new-pwd" autocomplete="new-password" disabled style="border: 1px solid lightgray; margin-bottom: 0.75rem; padding: 0.375rem 0.5rem; width: 100%; border-radius: 4px; box-sizing:border-box;">
                <label for="new-again" style="margin-bottom:0.25rem; display:block;">Повторите пароль</label>
                <input type="password" id="new-again" autocomplete="new-password" disabled style="border: 1px solid lightgray; margin-bottom: 1rem; padding: 0.375rem 0.5rem; width: 100%; border-radius: 4px; box-sizing:border-box;">
                <div style="text-align:center; display:none;" class="wait-toggle"><img src="/i/ajax.gif"></div>
                <div style="display: flex; gap: 0.5rem;" class="ch-toggle">
                    <button style="flex:1; padding:0.5rem; background:#3b82f6; color:#fff; border:none; border-radius:6px; cursor:pointer;" type="button" onclick="changePwd()">Сменить</button>
                    <button style="flex:1; padding:0.5rem; background:#fff; color:#333; border:1px solid #ccc; border-radius:6px; cursor:pointer;" type="button" onclick="closeChangePasswordForm();">Отменить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cookie Consent Banner -->
    <div id="cookie-consent">
        <span style="font-size:0.9rem;">Мы используем куки для обеспечения работы сайта. Продолжая использовать сайт, вы соглашаетесь с их использованием.</span>
        <button type="button" onclick="cookieAccept()" style="background:#3b82f6; color:#fff; border:none; border-radius:6px; padding:0.5rem 1.25rem; font-size:0.9rem; cursor:pointer; white-space:nowrap;">Принять</button>
    </div>
    <script>
        (function() {
            if (!localStorage.getItem('cookie_consent')) {
                document.getElementById('cookie-consent').style.display = 'flex';
            }
        })();
        function cookieAccept() {
            localStorage.setItem('cookie_consent', '1');
            document.getElementById('cookie-consent').style.display = 'none';
        }
    </script>

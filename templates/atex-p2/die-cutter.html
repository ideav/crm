<!-- Рабочее место atex «Пульт высечки» (Оператор, планшет). -->
<!-- Решение ideav/crm#5326 (Фаза 2, шаг 8). См. docs/atex_workplaces.md §3.19 -->
<!-- и docs/WORKSPACE_DEVELOPMENT_GUIDE.md. URL: /ateh1/die-cutter -->
<link rel="stylesheet" href="/download/{_global_.z}/css/atex-brand.css?{_global_.version}.3">
<link rel="stylesheet" href="/download/{_global_.z}/css/die-cutter.css?{_global_.version}.1">
<script src="/download/{_global_.z}/js/label-production.js?{_global_.version}.27" defer></script>
<script src="/download/{_global_.z}/js/idle-logout.js?{_global_.version}.1"
        data-idle-root="atex-dc-app" defer></script>
<!-- Скрипт пульта подключает сторож планшета pad-guard.js (#4666, #5330) — только после того, -->
<!-- как планшет опознан в таблице «Планшет». Каркас пульта рисует сам die-cutter.js: сторож -->
<!-- пишет свои экраны в этот же корень. -->
<script src="/download/{_global_.z}/js/pad-guard.js?{_global_.version}.9"
        data-pad-roles="1621"
        data-pad-kind="dieCutter"
        data-pad-root="atex-dc-app"
        data-pad-app="/download/{_global_.z}/js/die-cutter.js?{_global_.version}.7" defer></script>

<div id="atex-dc-app" class="atex-dc atex-brand"
     data-db="{_global_.z}"
     data-xsrf="{_global_.xsrf}"
     data-user="{_global_.user}"
     data-user-id="{_global_.user_id}"></div>

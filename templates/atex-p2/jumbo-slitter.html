<!-- Рабочее место atex «Пульт большого слиттера» (Оператор, планшет). -->
<!-- Решение ideav/crm#5315 (Фаза 2, шаг 6). См. docs/atex_workplaces.md §3.18 -->
<!-- и docs/WORKSPACE_DEVELOPMENT_GUIDE.md. URL: /atex/jumbo-slitter -->
<link rel="stylesheet" href="/download/{_global_.z}/css/atex-brand.css?{_global_.version}.3">
<link rel="stylesheet" href="/download/{_global_.z}/css/jumbo.css?{_global_.version}.2">
<script src="/download/{_global_.z}/js/label-production.js?{_global_.version}.26" defer></script>
<script src="/download/{_global_.z}/js/jumbo-cut-map.js?{_global_.version}.2" defer></script>
<script src="/download/{_global_.z}/js/jumbo-slitter.js?{_global_.version}.2" defer></script>

<div id="atex-js-app" class="atex-jb atex-brand"
     data-db="{_global_.z}"
     data-xsrf="{_global_.xsrf}"
     data-user-id="{_global_.user_id}">
    <div class="atex-jb-toolbar">
        <h1 class="atex-jb-title">Пульт большого слиттера</h1>
    </div>

    <div id="atex-js-message" class="atex-jb-message" hidden></div>

    <div class="atex-jb-pad">
        <aside class="atex-jb-panel">
            <h2 class="atex-jb-panel-title">Задания первичной резки</h2>
            <div id="atex-js-list"></div>
        </aside>
        <section id="atex-js-job" class="atex-jb-panel"></section>
    </div>

    <div id="atex-js-modal" class="atex-jb-modal" hidden>
        <div class="atex-jb-modal-box" role="dialog" aria-modal="true">
            <div id="atex-js-modal-text"></div>
            <div class="atex-jb-modal-actions">
                <button id="atex-js-modal-cancel" class="atex-jb-btn" type="button">Отмена</button>
                <button id="atex-js-modal-ok" class="atex-jb-btn atex-jb-btn-primary" type="button">Подтвердить</button>
            </div>
        </div>
    </div>
</div>

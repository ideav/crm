<!-- Рабочее место atex «Планирование высечки» (роль Диспетчер, чтение — Руководитель). -->
<!-- Решение ideav/crm#5320 (Фаза 2, шаг 7). См. docs/atex_workplaces.md (раздел «Планирование высечки») -->
<!-- Вид очереди — как у планирования Фазы 1 (классы atex-pp-*, production-planning.css). См. docs/WORKSPACE_DEVELOPMENT_GUIDE.md. URL: /&lt;база&gt;/die-planning -->
<link rel="stylesheet" href="/download/{_global_.z}/css/atex-brand.css?{_global_.version}.3">
<link rel="stylesheet" href="/download/{_global_.z}/css/production-planning.css?{_global_.version}.25">
<link rel="stylesheet" href="/download/{_global_.z}/css/die-planning.css?{_global_.version}.5">
<script src="/download/{_global_.z}/js/label-production.js?{_global_.version}.27" defer></script>
<script src="/download/{_global_.z}/js/label-orders.js?{_global_.version}.7" defer></script>
<script src="/download/{_global_.z}/js/jumbo-cut-map.js?{_global_.version}.1" defer></script>
<script src="/download/{_global_.z}/js/master-rolls-core.js?{_global_.version}.1" defer></script>
<script src="/download/{_global_.z}/js/die-planning-core.js?{_global_.version}.11" defer></script>
<script src="/download/{_global_.z}/js/die-planning.js?{_global_.version}.10" defer></script>

<div id="atex-dp-app" class="atex-dp atex-pp atex-brand"
     data-db="{_global_.z}"
     data-xsrf="{_global_.xsrf}"
     data-user-id="{_global_.user_id}">
    <div class="atex-pp-layout">
        <section class="atex-pp-panel atex-pp-queue-panel">
            <div class="atex-pp-panel-head">
                <h2 class="atex-pp-form-title">Очередь заданий высечки по станкам</h2>
                <div class="atex-pp-panel-actions">
                    <button class="atex-pp-btn atex-pp-btn-primary" type="button" data-act="form" title="Создать задания высечки из позиций заказов этикетки: нож подобран, ИТС не ждёт, задания ещё нет">Сформировать</button>
                    <button class="atex-pp-btn" type="button" data-act="order" title="Пересобрать очередь всех станков: группировка вал → нож → сырьё без новой просрочки. План не записывается">Упорядочить</button>
                    <button id="atex-dp-apply" class="atex-pp-btn" type="button" data-act="apply" disabled title="Записать построенный план: старт, станок, вал, наладка, длительность">Применить</button>
                    <button class="atex-pp-btn" type="button" data-act="reserve" title="Зарезервировать целые мастер-рулоны под задания по правилам склада">Зарезервировать МР</button>
                    <button class="atex-pp-btn" type="button" data-act="sleeves" title="Создать задачи на втулки под позициями заданий">Задачи на втулки</button>
                    <button class="atex-pp-btn" type="button" data-act="refresh" title="Перечитать данные">Обновить</button>
                </div>
            </div>
            <div id="atex-dp-message" class="atex-dp-message" hidden></div>
            <div class="atex-dp-tabs" role="tablist">
                <button class="atex-dp-tab is-active" type="button" data-tab="queue">Очередь</button>
                <button class="atex-dp-tab" type="button" data-tab="deficit">Дефицит форматов</button>
                <button class="atex-dp-tab" type="button" data-tab="gantt">Гант</button>
                <button class="atex-dp-tab" type="button" data-tab="load">Загрузка ножей и валов</button>
            </div>
            <div id="atex-dp-body" class="atex-pp-queue"></div>
        </section>
        <aside id="atex-dp-side" class="atex-pp-panel atex-pp-link"></aside>
    </div>

    <div id="atex-dp-modal" class="atex-dp-modal" hidden>
        <div class="atex-dp-modal-box" role="dialog" aria-modal="true">
            <div id="atex-dp-modal-text"></div>
            <div id="atex-dp-modal-error" class="atex-dp-modal-error"></div>
            <div class="atex-dp-modal-actions">
                <button id="atex-dp-modal-cancel" class="atex-dp-btn" type="button">Закрыть</button>
                <button id="atex-dp-modal-ok" class="atex-dp-btn atex-dp-btn-primary" type="button">Подтвердить</button>
            </div>
        </div>
    </div>
</div>

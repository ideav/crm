<!-- Рабочее место atex «Пульт слиттера» (роль Оператор, планшет). -->
<!-- Решение ideav/crm#2915 (часть #2903). См. docs/atex_workplaces.md §3.5 -->
<!-- и docs/WORKSPACE_DEVELOPMENT_GUIDE.md. URL: /atex/slitter -->
<link rel="stylesheet" href="/download/{_global_.z}/css/atex-brand.css?{_global_.version}.2">
<link rel="stylesheet" href="/download/{_global_.z}/css/slitter.css?{_global_.version}.4">
<div id="atex-slitter"
     class="atex-sl atex-brand"
     data-db="{_global_.z}"
     data-xsrf="{_global_.xsrf}"
     data-user="{_global_.user}"
     data-user-id="{_global_.user_id}">
    <div class="atex-sl-loading">Загрузка пульта слиттера…</div>
</div>
<script src="/download/{_global_.z}/js/ref-search.js?0{_global_.version}" defer></script>
<!-- issue #4682: счётчик времени активности. 3 часа без действий — кука с токеном -->
<!-- снимается, человек уходит на форму входа. См. docs/atex_workplaces.md §3.15 -->
<script src="/download/{_global_.z}/js/idle-logout.js?{_global_.version}.1"
        data-idle-root="atex-slitter" defer></script>
<!-- issue #4666: скрипт пульта подключает сторож планшета — и только после того, -->
<!-- как планшет опознан в таблице «Планшет». Незарегистрированный планшет пульт -->
<!-- вообще не загружает. -->
<script src="/download/{_global_.z}/js/pad-guard.js?{_global_.version}.2"
        data-pad-root="atex-slitter"
        data-pad-app="/download/{_global_.z}/js/slitter.js?{_global_.version}.15" defer></script>

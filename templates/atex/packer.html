<!-- Рабочее место atex «Упаковка» (роль Упаковщик, планшет). -->
<!-- Решение ideav/crm#4658. См. docs/atex_workplaces.md §3.13 -->
<!-- и docs/WORKSPACE_DEVELOPMENT_GUIDE.md. URL: /atex/packer -->
<link rel="stylesheet" href="/download/{_global_.z}/css/atex-brand.css?{_global_.version}.2">
<link rel="stylesheet" href="/download/{_global_.z}/css/packer.css?{_global_.version}.4">
<div id="atex-packer"
     class="atex-pk atex-brand"
     data-db="{_global_.z}"
     data-xsrf="{_global_.xsrf}"
     data-user="{_global_.user}"
     data-user-id="{_global_.user_id}">
    <div class="atex-pk-loading">Загрузка рабочего места упаковщика…</div>
</div>
<!-- issue #4682: счётчик времени активности. 3 часа без действий — кука с токеном -->
<!-- снимается, человек уходит на форму входа. См. docs/atex_workplaces.md §3.15 -->
<script src="/download/{_global_.z}/js/idle-logout.js?{_global_.version}.1"
        data-idle-root="atex-packer" defer></script>
<!-- issue #4665: подбор типоразмера упаковки (короб и норма укладки). Общий модуль
     с планированием; грузится обычным тегом — сторож планшета подключает packer.js
     позже, поэтому window.AtexPackagingSize к его старту уже на месте. -->
<script src="/download/{_global_.z}/js/packaging-size.js?{_global_.version}.2" defer></script>
<!-- issue #4666: скрипт рабочего места подключает сторож планшета — и только после -->
<!-- того, как планшет опознан в таблице «Планшет». Незарегистрированный планшет -->
<!-- рабочее место вообще не загружает. -->
<script src="/download/{_global_.z}/js/pad-guard.js?{_global_.version}.2"
        data-pad-root="atex-packer"
        data-pad-app="/download/{_global_.z}/js/packer.js?{_global_.version}.6" defer></script>

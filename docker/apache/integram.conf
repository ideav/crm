        AllowOverride None
        Options -ExecCGI
        <FilesMatch "\.(php|php[0-9]*|phps|phtml|pht|phar|cgi|pl|fcgi|fpl|asp|jsp|sh|htaccess|htpasswd)$">
            Require all denied
        </FilesMatch>
        # Загруженный html/svg/xml открывается на том же origin, что и все базы: его скрипт ходил бы в API
        # любой базы с куками посетителя. CSP sandbox даёт такой странице отдельный (opaque) origin.
        Header always set X-Content-Type-Options "nosniff"
        <FilesMatch "\.(?i:html?|xhtml|shtml|svgz?|xml|xsl)$">
            Header always set Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-modals allow-downloads"
        </FilesMatch>
        # mirror of download/.htaccess (prod reads .htaccess; docker has AllowOverride None)
        <If "(%{REQUEST_URI} =~ /^\/download\/[^\/]+\/[0-9]+[0-9a-f]{8}\/[0-9]{3}[0-9a-f]{8}\.[0-9a-zA-Z]*$/) && (%{REQUEST_URI} !~ /\.(?i:jpe?g|png|gif|webp|bmp|ico|avif|heic|tiff?)$/)">
            Header set Content-Disposition "attachment"
        </If>
        <If "%{REQUEST_URI} =~ /^\/download\/[^\/]+\/[0-9]+[0-9a-f]{8}\/[0-9]{3}[0-9a-f]{8}\.(?i:html?|xhtml|svg|xml)$/)">
            Header set Content-Security-Policy "sandbox"
        </If>
    </Directory>
    <Directory /var/www/html/templates/custom>
        AllowOverride None
        Options -ExecCGI
        <FilesMatch "\.(php|php[0-9]*|phps|phtml|pht|phar|cgi|pl|fcgi|fpl|asp|jsp|sh|htaccess|htpasswd)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Шаблоны отдаёт только index.php; в templates/custom/<база> лежат бэкапы базы (backups)
    # и трассировки запросов (logs) — наружу каталог не отдаётся целиком, как в templates/.htaccess.
    <Directory /var/www/html/templates>
        Require all denied
    </Directory>

    # Логи приложения (index.php: LOGS_DIR = "logs/") лежат под DocumentRoot, то есть
    # без запрета отдаются по http: в них строка на КАЖДЫЙ запрос — адрес клиента, URI
    # и POST-параметры (index.php, wlog у обработки запроса). Наружу не отдаём ничего:
    # запрет на весь каталог, а не на отдельные имена файлов.
    <Directory /var/www/html/logs>
        AllowOverride None
        Require all denied
    </Directory>

    # Защитные заголовки всех ответов (python2node#1142): чужой сайт не встроит страницы баз
    # во фрейм (кликджекинг), браузер не угадывает тип содержимого, адрес с параметрами не
    # уходит в Referer на чужие сайты. CSP здесь — только frame-ancestors; политика скриптов —
    # отдельным шагом (в шаблонах много inline-скриптов).
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        # Вебвизор Метрики проигрывает визит во фрейме своего сайта: frame-ancestors его пускает
        # (браузер с CSP берёт frame-ancestors и не смотрит на X-Frame-Options).
        Header always set Content-Security-Policy "frame-ancestors 'self' https://webvisor.com https://*.webvisor.com https://metrika.yandex.ru https://*.metrika.yandex.ru"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # HSTS — с малым сроком; срок увеличивается, когда https на хосте проверен.
        Header always set Strict-Transport-Security "max-age=300"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ssl-access.log combined
</VirtualHost>
</IfModule>

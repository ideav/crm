name: tests

# Регрессионная сеть репозитория. Зависимостей нет — только Node, поэтому шаг install не нужен.
# Красное = мержить нельзя. Известный долг вынесен в experiments/quarantine.txt и в гейт не входит.

on:
  # `edited` нужен храповику (#4515): разрешающая строка `RATCHET-OK:` живёт в ТЕЛЕ PR, а тело
  # читается на момент запуска. Без `edited` дописанная причина ничего не меняла бы — красный чек
  # висел бы до ручного перезапуска job или пустого коммита, и это ловушка ровно в тот момент, когда
  # ослабление ЗАКОННО. Перечисляя types, дефолты приходится выписать целиком:
  # `opened`/`synchronize`/`reopened` — это они.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Прогон гейта
        run: bash scripts/run-tests.sh

  # Храповик (#4515): зелёный гейт ничего не значит, если ожидание теста правится тем же PR, что и
  # код. Отдельной работой — чтобы в списке чеков было видно, что именно покраснело.
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна история: сравниваем с merge-base базовой ветки
      - name: Ослабление ожиданий существующих тестов
        env:
          RATCHET_DECLARATION: ${{ github.event.pull_request.body }}
        run: bash scripts/check-test-ratchet.sh "origin/${{ github.event.pull_request.base.ref }}"

  # #4751: НОВЫЕ проверки по ТЕКСТУ ИСХОДНИКА. Утверждение о написании кода молчит, когда
  # поведение сломано, и краснеет от рефакторинга — тогда его правит автор соседнего фикса.
  # Ровно так держался цикл из десяти тикетов про «день не набит» (#4469 → #4751). Отдельной
  # работой, как и храповик: в списке чеков должно быть видно, что именно покраснело.
  text-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна история: сравниваем с merge-base базовой ветки
      - name: Новые проверки по тексту исходника
        env:
          TEXT_ASSERT_DECLARATION: ${{ github.event.pull_request.body }}
        run: bash scripts/check-text-assertions.sh "origin/${{ github.event.pull_request.base.ref }}"

<!DOCTYPE html>
<!-- Браузерный стенд для рабочего места «Пульт слиттера» (#2915).
     Мокает fetch: metadata, object/{id} и команды _m_*.
     Открывать локально, использует те же js/css, что и продакшн-шаблон. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>atex · Пульт слиттера — стенд</title>
<link rel="stylesheet" href="../download/atex/css/slitter.css">
<style>
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#eef1f5;height:100vh;display:flex;flex-direction:column}
    /* #4783: заглушка шапки main.html — пульт пишет в .navbar-workspace «планшет · дата · станок» */
    .navbar{display:flex;align-items:center;height:48px;padding:0 14px;background:#fff;border-bottom:1px solid #d9dee5;flex:none}
    .app-content{flex:1;min-height:0;overflow:hidden;padding:0}
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-workspace">Планшет слиттера №1</div></nav>
<div class="app-content">
<div id="atex-slitter" class="atex-sl" data-db="atex" data-xsrf="test-token" data-user="operator" data-user-id="701">
    <div class="atex-sl-loading">Загрузка…</div>
</div>
</div>

<script>
// #4666/#4783: имя планшета в боевом пульте кладёт сторож pad-guard.js — здесь стенд
// подставляет его сам (сторож в стенде не участвует).
// #4789: планшет настроен на станок — пульт открывается сразу на нём, а выбор станка
// пишется обратно в таблицу «Планшет» (в стенде запись только логируется).
window.atexPad = {
    id: '1', name: 'Планшет слиттера №1', canWrite: true,
    config: { slitter: { id: '1', label: 'Слиттер-1' }, cutter: null, place: null, workspace: 'slitter' },
    setObject: function(kind, obj) {
        console.log('[mock] atexPad.setObject', kind, JSON.stringify(obj));
        return Promise.resolve({ saved: true, reason: '' });
    }
};
window.AtexPadGuard = {
    matchPadObject: function(options, obj) {
        var id = String((obj && obj.id) || ''), label = String((obj && obj.label) || '').toLowerCase();
        var hit = (options || []).filter(function(o) { return String(o.id) === id; })[0]
            || (options || []).filter(function(o) { return String(o.label).toLowerCase() === label; })[0];
        return hit ? String(hit.id) : '';
    }
};
// ── Мок схемы atex (имена как в docs/atex_metadata.json; id произвольные) ──
var META = [
    { id: 105, val: 'Вид сырья', reqs: [
        { id: 1040, val: 'Ширина, мм' }
    ]},
    { id: 106, val: 'Партия сырья', reqs: [
        { id: 1044, val: 'Вид сырья' },
        { id: 1046, val: 'Дата прихода' },
        { id: 1048, val: 'Получено, м²' },
        { id: 1050, val: 'Остаток, м²' },
        { id: 1052, val: 'Остаток, м' },
        { id: 1054, val: 'В работе' },
        { id: 1056, val: 'Штрих-код' }
    ]},
    { id: 107, val: 'Слиттер', reqs: [
        { id: 1072, val: 'Статус' }
    ]},
    // #4353: «Дата план» — ГЛАВНОЕ значение записи (r[0], DATETIME unix-сек), отдельного
    // реквизита с таким именем в таблице НЕТ — как в боевой ateh (1078). Мок с «Датой план»
    // отдельной колонкой скрывал баг: colIndex по имени в бою даёт -1.
    { id: 110, val: 'Производственная резка', reqs: [
        { id: 1090, val: 'Слиттер' },
        { id: 1092, val: 'Тип резки' },
        { id: 1094, val: 'Партия сырья' },
        { id: 1098, val: 'Статус' },
        { id: 1100, val: 'Счётчик нач.' },
        { id: 1102, val: 'Счётчик кон.' },
        { id: 1104, val: 'Погонаж факт, м' },
        { id: 1106, val: 'Брак, м²' },
        { id: 1107, val: 'Брак, м' },
        { id: 1108, val: 'Фото брака' },
        { id: 1110, val: 'Очередность' },
        { id: 1111, val: 'Кол-во план' },
        { id: 1113, val: 'Метраж, м' },
        { id: 1115, val: 'Начато' },
        { id: 1116, val: 'Примечания' },
        // #4362: «Закончено» — по нему (а не по колонке «Статус») выводится «Завершена»
        // (deriveCutStatus). Без него завершённое задание стенда показывалось «В работе».
        { id: 1118, val: 'Закончено' },
        // #4366: булева галка «В работе» (в боевой 1078 это реквизит 1162 BOOLEAN) — по
        // завершении задания её надо снимать; в логе мока видно `t1119=0`.
        { id: 1119, val: 'В работе' },
        // #4564: сколько проходов сделано (в боевой 1078 это 657315). Его пишет отметка
        // «✓ Готово» / «✓N Готовы несколько» (#4604), из него живёт заголовок «Резка N из M».
        // Без реквизита стенд ронял в консоль «проходы не сохраняются» и счёт проходов терялся.
        { id: 1121, val: 'Кол-во резок факт' }
    ]},
    // #4783: «Партия ГП» — подчинённая заданию таблица полос (раскладка ножей). Без неё
    // стенд рисовал «У резки нет полос» и по нему нельзя было проверить высоту правой части.
    { id: 113, val: 'Партия ГП', reqs: [
        { id: 1130, val: 'Ширина, мм' },
        { id: 1132, val: 'Кол-во полос' },
        { id: 1134, val: 'Назначение' }
    ]},
    { id: 111, val: 'Расход сырья', reqs: [
        { id: 1112, val: 'Израсходовано, м²' },
        { id: 1114, val: 'Партия сырья' }
    ]},
    // #4359: у события смены есть ссылка «Слиттер» — станок события хранится ссылкой,
    // а не только меткой «{станок} · {дата}» в «Примечаниях» (как в боевой ateh, 1082/642887).
    { id: 114, val: 'Событие смены', reqs: [
        { id: 1138, val: 'Тип события' },
        { id: 1140, val: 'Производственная резка' },
        { id: 1142, val: 'Пользователь' },
        { id: 1144, val: 'Значение' },
        { id: 1146, val: 'Примечания' },
        { id: 1148, val: 'Слиттер' }
    ]}
];

// Хранилище-заглушка. r = [главное значение, ...reqs по порядку метаданных].
var TODAY = new Date().toISOString().slice(0, 10);
// #4353: плановый старт задания — главное значение записи, DATETIME в unix-секундах.
function planAt(hhmm) { return String(Math.floor(new Date(TODAY + 'T' + hhmm + ':00').getTime() / 1000)); }
// #4362: плановый старт СЛЕДУЮЩЕГО дня — для секции «Следующее задание» (#4332 п.4).
function planTomorrowAt(hhmm) { return String(Math.floor(new Date(TODAY + 'T' + hhmm + ':00').getTime() / 1000) + 86400); }
var DB = {
    // #4783: полосы заданий (подчинённые «Партии ГП»): [имя, ширина, кол-во полос, назначение]
    strips: {
        '301': [ { i: 9011, u: '301', r: ['Полоса 250', '250', '3', 'Заказ'] },
                 { i: 9012, u: '301', r: ['Полоса 80', '80', '1', 'Склад'] } ],
        '302': [ { i: 9021, u: '302', r: ['Полоса 250', '250', '3', 'Заказ'] },
                 { i: 9022, u: '302', r: ['Полоса 150', '150', '1', 'Заказ'] } ],
        '303': [ { i: 9031, u: '303', r: ['Полоса 400', '400', '2', 'Заказ'] } ]
    },
    materials: [
        { i: 5, r: ['БОПП', '910'] },
        { i: 6, r: ['ПЭТ', '880'] }
    ],
    batches: [
        { i: 601, r: ['Партия А-100 (БОПП)', '5:БОПП', '2026-05-10', '5000', '1200', '900', '1', 'BOPP-A100'] },
        { i: 603, r: ['Партия А-098 (БОПП)', '5:БОПП', '2026-05-02', '4000', '900', '650', '1', 'BOPP-A098'] },
        { i: 602, r: ['Партия Б-205 (ПЭТ)', '6:ПЭТ', '2026-05-18', '8000', '8000', '1200', '1', 'PET-B205'] }
    ],
    slitters: [
        { i: 1, r: ['Слиттер-1', 'В работе'] },
        { i: 2, r: ['Слиттер-2', 'В работе'] }
    ],
    // #4353: очередь Слиттера-1 — завершённое, первое открытое «Ожидает» и ещё одно «Ожидает»
    // за ним (306). У 306 кнопок управления быть не должно, пока 301 не закрыто.
    cuts: [
        { i: 301, r: [planAt('08:00'), '1:Слиттер-1', '11:25×35 БОПП', '601:Партия А-100', 'Ожидает', '', '', '', '', '', '', '1', '4', '400', '', ''] },
        // #4564/#4604: у 302 один проход уже отмечен — стенд показывает «Резка 2 из 4», а
        // «✓N Готовы несколько» досчитывает остаток от него, а не с нуля.
        { i: 302, r: [planAt('09:00'), '1:Слиттер-1', '11:25×35 БОПП', '601:Партия А-100', 'В работе', '1000', '1400', '400', '', '', '', '2', '4', '400', TODAY + ' 09:00:00', 'Идёт резка', '', '1', '1'] },
        { i: 303, r: [planAt('07:00'), '1:Слиттер-1', '11:25×35 БОПП', '601:Партия А-100', 'Завершён', '500', '2200', '1700', '', '', '', '3', '4', '400', TODAY + ' 07:00:00', '', TODAY + ' 07:50:00', ''] },
        { i: 306, r: [planAt('10:00'), '1:Слиттер-1', '11:25×35 БОПП', '601:Партия А-100', 'Ожидает', '', '', '', '', '', '', '4', '3', '400', '', ''] },
        // #4362: Слиттер-2 — задания дня выполнены, на СЛЕДУЮЩИЙ день ждёт 305 (секция
        // «Следующее задание», #4332 п.4). У 305 должны быть и кнопки статуса, и «✓ Готово».
        { i: 304, r: [planAt('08:30'), '2:Слиттер-2', '12:55мм ПЭТ', '602:Партия Б-205', 'Завершён', '1200', '750', '450', '', '', '', '1', '2', '450', TODAY + ' 08:30:00', '', TODAY + ' 09:20:00'] },
        // #4365: 305 оператор УЖЕ ВЫПОЛНИЛ (завтрашний день) — из секции пропадать не должно;
        // следующим ожидающим идёт 307 того же дня.
        { i: 305, r: [planTomorrowAt('08:00'), '2:Слиттер-2', '12:55мм ПЭТ', '602:Партия Б-205', 'Завершён', '750', '300', '450', '', '', '', '1', '3', '450', TODAY + ' 15:10:00', '', TODAY + ' 15:40:00'] },
        { i: 307, r: [planTomorrowAt('10:00'), '2:Слиттер-2', '12:55мм ПЭТ', '602:Партия Б-205', 'Ожидает', '', '', '', '', '', '', '2', '2', '450', '', ''] }
    ],
    consumptions: {
        301: [ { i: 401, r: ['Расход 1', '300', '601:Партия А-100'] } ],
        302: [],
        303: [],
        304: [],
        305: [],
        307: [],
        306: []
    },
    events: [],
    nextId: 900
};

function field(metaId, row, reqId) {
    var meta = META.filter(function(m){ return String(m.id) === String(metaId); })[0];
    var order = [String(meta.id)].concat(meta.reqs.map(function(r){ return String(r.id); }));
    return order.indexOf(String(reqId));
}

// #4374: применить _m_set к записи мок-БД: t{reqId} → колонка r по порядку метаданных.
function applySet(objId, body) {
    var tables = [[105, DB.materials], [106, DB.batches], [107, DB.slitters], [110, DB.cuts], [114, DB.events]];
    tables.forEach(function(pair) {
        var metaId = pair[0];
        (pair[1] || []).forEach(function(rec) {
            if (String(rec.i) !== String(objId)) return;
            var meta = META.filter(function(m){ return String(m.id) === String(metaId); })[0];
            var order = [String(meta.id)].concat(meta.reqs.map(function(r){ return String(r.id); }));
            order.forEach(function(reqId, idx) {
                if (!body.has('t' + reqId)) return;
                var v = body.get('t' + reqId);
                // булев реквизит: '0'/пусто = снято, иначе 'X' (как отдаёт сервер)
                rec.r[idx] = (reqId === '1054' || reqId === '1119')
                    ? ((v === '' || v === '0') ? '' : 'X')
                    : v;
            });
        });
    });
}

var realFetch = window.fetch;
window.fetch = function(url, opts) {
    var u = String(url);
    function json(data) {
        return Promise.resolve(new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    if (/\/metadata(?:$|\?)/.test(u)) return json(META);
    // #4370: отчёт next_cut_setup (93371) — конфигурация предстоящих резок станка по
    // расписанию. Нужен для подсказки «бесшовное продолжение смены» (.atex-sl-seamless):
    // у Слиттера-1 первая резка СЛЕДУЮЩЕГО дня идёт на том же сырье (material_id 5).
    if (/\/report\/next_cut_setup/.test(u)) {
        var slId = (u.match(/FR_slitter_id=([^&]+)/) || [])[1] || '';
        if (String(slId) !== '1') return json([]);
        return json([
            { task_id: '306', task_start: planAt('10:00'), width: '250', material_id: '5', batch_ord: '1' },
            { task_id: '350', task_start: planTomorrowAt('08:00'), width: '250', material_id: '5', batch_ord: '1' }
        ]);
    }
    // #4606: отчёт cut_planning отдаёт номера заказов заданий (цепочка Задание →
    // Обеспечение → Позиция → Заказ): строк на задание столько, сколько обеспечений.
    // У 302 два заказа (карточка показывает «3738, 3742»), у 306 заказа нет — задание
    // в запас, номер не рисуется.
    if (/\/report\/cut_planning/.test(u)) {
        return json([
            { cut_id: '301', order_no: '3737' },
            { cut_id: '302', order_no: '3738' },
            { cut_id: '302', order_no: '3738' },
            { cut_id: '302', order_no: '3742' },
            { cut_id: '303', order_no: '3730' },
            { cut_id: '304', order_no: '3741' },
            { cut_id: '305', order_no: '3745' },
            { cut_id: '307', order_no: '3748' }
        ]);
    }
    var mObj = u.match(/\/object\/(\d+)\//);
    if (mObj) {
        var tid = mObj[1];
        var fi = u.match(/F_I=(\d+)/);
        var fu = u.match(/F_U=(\d+)/);
        if (tid === '105') return json(DB.materials);
        if (tid === '106') {
            // #4374: боевой report/material_batches?FR_is_active=%25 отдаёт ТОЛЬКО партии с
            // проставленной «В работе» (проверено на ateh: 62 строки из 96 записей 1074).
            var actIdx = field(106, null, 1054);
            return json(DB.batches.filter(function(b){ return String(b.r[actIdx] || '').trim() !== ''; }));
        }
        if (tid === '107') return json(DB.slitters);
        if (tid === '110') {
            if (fi) return json(DB.cuts.filter(function(c){ return String(c.i) === fi[1]; }));
            return json(DB.cuts);
        }
        if (tid === '113') return json((fu && DB.strips[fu[1]]) || []);
        if (tid === '111') return json((fu && DB.consumptions[fu[1]]) || []);
        if (tid === '114') return json(DB.events);
    }
    if (/\/_m_new\//.test(u)) {
        var id = DB.nextId++;
        var table = (u.match(/\/_m_new\/(\d+)/) || [])[1];
        var up = (u.match(/[?&]up=([^&]+)/) || [])[1] || '1';
        var body = new URLSearchParams((opts && opts.body) || '');
        var meta = META.filter(function(m){ return String(m.id) === String(table); })[0];
        if (meta && String(table) === '114') {
            var eventRow = [body.get('t' + meta.id) || ''];
            meta.reqs.forEach(function(req){ eventRow.push(body.get('t' + req.id) || ''); });
            DB.events.unshift({ i: id, u: decodeURIComponent(up), r: eventRow });
        }
        console.log('[mock] _m_new', u, opts && opts.body);
        return json({ obj: id, i: id });
    }
    if (/\/_m_set\//.test(u)) {
        // #4374: правка ПРИМЕНЯЕТСЯ к мок-данным (раньше только логировалась) — иначе стенд
        // не воспроизводит последствия записи: снятую «В работе» партии, проставленное
        // «Закончено» у задания.
        applySet((u.match(/\/_m_set\/(\d+)/) || [])[1], new URLSearchParams((opts && opts.body) || ''));
        console.log('[mock]', u, opts && opts.body);
        return json({ ok: 1 });
    }
    if (/\/_m_save\//.test(u) || /\/_m_del\//.test(u)) {
        console.log('[mock]', u, opts && opts.body);
        return json({ ok: 1 });
    }
    return realFetch(url, opts);
};
</script>
<script src="../download/atex/js/slitter.js"></script>
</body>
</html>

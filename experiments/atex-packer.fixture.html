];

var realFetch = window.fetch;
window.fetch = function(url, opts) {
    var u = String(url);
    function json(data) {
        return Promise.resolve(new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    if (/\/metadata(?:$|\?)/.test(u)) return json(META);
    if (/\/report\/packer/.test(u)) return json(ROWS);
    if (/\/report\/pack_sizes/.test(u)) return json(SIZES);

    var mObj = u.match(/\/object\/(\d+)\//);
    if (mObj && mObj[1] === '669269') return json(PLACES);

    if (/\/_m_set\//.test(u)) {
        // Применяем правку к строке отчёта, чтобы UI отражал результат после действия.
        var id = (u.match(/_m_set\/(\d+)/) || [])[1];
        var body = (opts && opts.body) || '';
        var packed = (body.match(/t673786=([^&]*)/) || [])[1];
        var note = (body.match(/t673789=([^&]*)/) || [])[1];
        ROWS.forEach(function(r) {
            if (r.gp_id === id) {
                if (packed != null) r.packed = decodeURIComponent(packed);
                if (note != null) r.notes = decodeURIComponent(note.replace(/\+/g, ' '));
            }
        });
        console.log('[mock] _m_set', u, body);
        return json({ ok: 1 });
    }
    if (/\/_m_new\//.test(u)) {
        console.log('[mock] _m_new', u, opts && opts.body);
        return json({ id: 999 });
    }
    return realFetch(url, opts);
};

<!DOCTYPE html>
<!-- Браузерный стенд для рабочего места «Расчёт оптимальной резки» (#3465, #3474).
     Мокает fetch: metadata, справочники (Вид сырья / Фактическая ширина резки /
     Диаметр втулки / Клиент / Лидер / Заказ / Максимальный запас), report/nextOrder
     и запись позиций (_m_new). #4779: несколько ширин + точки запаса.
     Использует те же js/css, что и продакшн-шаблон templates/atex/cut-optimizer.html.
     Открывать локально в браузере. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>atex · Расчёт оптимальной резки — стенд</title>
<link rel="stylesheet" href="../download/atex/css/cut-optimizer.css">
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#eef1f5}</style>
</head>
<body>
<div id="atex-cut-optimizer" class="atex-co" data-db="atex" data-xsrf="test-token" data-user="dispatcher">
    <div class="atex-co-loading">Загрузка…</div>
</div>

<script>
window.uid = '42';
// ── Мок схемы atex (имена как в docs/atex_metadata.json; id произвольные) ──
var META = [
    { id: 100, val: 'Вид сырья', reqs: [
        { id: 1001, val: 'Полное название' },
        { id: 1003, val: 'Ширина, мм' },
        { id: 1005, val: 'Длина рулона, м' },
        { id: 1009, val: 'Допуск, мм' }
    ]},
    { id: 660, val: 'Фактическая ширина резки', reqs: [
        { id: 6601, val: 'Ширина в заказе' },
        { id: 6603, val: 'Код' }
    ]},
    { id: 107, val: 'Заказ', reqs: [
        { id: 1052, val: 'Клиент' }, { id: 1054, val: 'Пользователь' },
        { id: 1056, val: 'Дата создания' }, { id: 1060, val: 'Статус' }, { id: 1062, val: 'Лидер' }
    ]},
    // «Заказанное количество»: кол-во — главное значение записи (t{tableId}), реквизита «Кол-во» нет.
    { id: 108, val: 'Позиция заказа', reqs: [
        { id: 1069, val: 'Вид сырья' }, { id: 1073, val: 'Ширина, мм' },
        { id: 1075, val: 'Длина, м' }, { id: 1077, val: 'Диаметр втулки' }, { id: 1151, val: 'Тип намотки' },
        { id: 1079, val: 'Статус' }
    ]},
    // #4804: у «Диаметра втулки» читаются Дюймы / Ширина втулки / Материал (→ 740).
    { id: 200, val: 'Диаметр втулки', reqs: [
        { id: 2001, val: 'Готовые' }, { id: 2002, val: 'Дюймы' },
        { id: 2003, val: 'Ширина втулки, мм' }, { id: 2004, val: 'Материал втулки' }
    ]},
    { id: 740, val: 'Материал втулки', reqs: [] },
    { id: 103, val: 'Клиент', reqs: [] },
    { id: 1132, val: 'Лидер', reqs: [] },
    // #4779: «Максимальный запас» (67113) — точки запаса; главное значение = макс. запас.
    { id: 671, val: 'Максимальный запас', reqs: [
        { id: 6711, val: 'Вид сырья' }, { id: 6713, val: 'Ширина, мм' },
        { id: 6715, val: 'Длина, м' }, { id: 6717, val: 'Тип намотки' },
        { id: 6719, val: 'Диаметр втулки' }, { id: 6721, val: 'Лидер' }
    ]}
];

// [Название, Полное название, Ширина, Длина рулона, Допуск мм]
var MATERIALS = [
    { i: 201, r: ['Сталь 0.5мм', 'Сталь холоднокатаная 0.5 мм', '880', '4000', '15'] },
    { i: 202, r: ['Алюминий 1.0мм', 'Алюминий АД1 1.0 мм', '910', '3000', '20'] }
];
// Фактическая ширина: [факт, Ширина в заказе, Код]
var ACTUAL = [
    { i: 301, r: ['59', '60', ''] },        // номинал 60 → факт 59 (безусловно)
    { i: 302, r: ['39', '40', 'j=880'] }    // номинал 40 → факт 39 при джамбо 880
];
// #4804: [Название, Готовые, Дюймы, Ширина втулки мм, Материал втулки].
var SLEEVES = [
    { i: 401, r: ['Втулка картонная 1" длина 1 метр', '', '1.00', '', '741:Картон'] },
    { i: 402, r: ['Втулка картонная 0.5" ширина 110 мм', 'X', '0.50', '110.00', '741:Картон'] },
    { i: 403, r: ['Втулка пластиковая чёрная 1" длина 1 метр', '', '1.00', '', '742:Пластик чёрная'] },
    { i: 404, r: ['Втулка пластиковая чёрная 1" ширина 100 мм', 'X', '1.00', '100.00', '742:Пластик чёрная'] }
];
var SLEEVE_MATERIALS = [ { i: 741, r: ['Картон'] }, { i: 742, r: ['Пластик чёрная'] } ];
var CLIENTS = [ { i: 501, r: ['ООО «Ромашка»'] }, { i: 502, r: ['ИП Петров'] } ];
var LEADERS = [ { i: 801, r: ['Лидер 40 мкм'] }, { i: 802, r: ['Без лидера'] } ];
var ORDERS = [ { i: 601, r: ['1001'] }, { i: 602, r: ['1002'] } ];
// #4779: точки запаса — [макс. запас, Вид сырья, Ширина, Длина, Намотка, Втулка, Лидер].
// Ссылочные поля приходят из JSON_OBJ как «id:Подпись».
var MAX_STOCK = [
    { i: 901, r: ['120', '202:Алюминий 1.0мм', '100', '450', 'OUT', '401:76 мм', '801:Лидер 40 мкм'] },
    { i: 902, r: ['80',  '202:Алюминий 1.0мм', '150', '450', 'OUT', '401:76 мм', ''] },
    { i: 903, r: ['40',  '202:Алюминий 1.0мм', '200', '450', 'IN',  '402:152 мм', '801:Лидер 40 мкм'] },
    { i: 904, r: ['60',  '202:Алюминий 1.0мм', '250', '900', 'OUT', '401:76 мм', ''] },   // другая длина
    { i: 905, r: ['30',  '201:Сталь 0.5мм',    '120', '450', 'OUT', '401:76 мм', ''] }    // другое сырьё
];
// Партии сырья (report/material_batches как в ateh): is_active 'X' = «В работе».
var BATCHES = [
    { batch_id: '701', batch_no: '1781000001', batch_material: 'Алюминий 1.0мм', batch_material_id: '202', batch_remainder_m2: '12000', batch_remainder_m: '', is_active: 'X', 'Склад': 'Производство' },
    { batch_id: '702', batch_no: '1781000002', batch_material: 'Алюминий 1.0мм', batch_material_id: '202', batch_remainder_m2: '5000',  batch_remainder_m: '', is_active: 'X', 'Склад': 'Производство' },
    { batch_id: '703', batch_no: '1781000003', batch_material: 'Алюминий 1.0мм', batch_material_id: '202', batch_remainder_m2: '900',   batch_remainder_m: '', is_active: 'X', 'Склад': 'Производство' },
    { batch_id: '704', batch_no: '1781000004', batch_material: 'Алюминий 1.0мм', batch_material_id: '202', batch_remainder_m2: '50',    batch_remainder_m: '', is_active: '',  'Склад': 'Производство' }, // не «В работе» — не показывается
    { batch_id: '705', batch_no: '1781000005', batch_material: 'Сталь 0.5мм',    batch_material_id: '201', batch_remainder_m2: '8000',  batch_remainder_m: '', is_active: 'X', 'Склад': 'Производство' }
];

window.fetch = function(url, opts) {
    var u = String(url);
    function json(data) {
        return Promise.resolve(new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    if (opts && String(opts.method).toUpperCase() === 'POST') {
        console.log('POST', u, opts.body);
        return json({ obj: Math.floor(1000 + Math.random() * 9000) });
    }
    if (/\/metadata(?:$|\?)/.test(u)) return json(META);
    if (/\/object\/100\//.test(u)) return json(MATERIALS);
    if (/\/object\/660\//.test(u)) return json(ACTUAL);
    if (/\/object\/200\//.test(u)) return json(SLEEVES);
    if (/\/object\/740\//.test(u)) return json(SLEEVE_MATERIALS);
    if (/\/object\/103\//.test(u)) return json(CLIENTS);
    if (/\/object\/107\//.test(u)) return json(ORDERS);
    if (/\/object\/1132\//.test(u)) return json(LEADERS);
    if (/\/object\/671\//.test(u)) return json(MAX_STOCK);
    if (/\/report\/nextOrder/i.test(u)) return json([{ 'Заказ': '3690' }]); // как в БД ateh
    if (/\/report\/material_batches/i.test(u)) return json(BATCHES);
    return json([]);
};
</script>
<script src="../download/atex/js/ref-search.js"></script>
<script src="../download/atex/js/cut-optimizer.js"></script>
</body>
</html>
